# denv-cc-remote の共通設定。
#
# サービスは docker-compose.yaml 側で定義し、
# このファイルの denv-cc-remote サービスを extends して共通設定を引き継ぐ。
#
# このファイルは compose から直接読み込まれることはない。
# docker-compose.yaml の extends から参照されるだけである。
#
# コンテナは待機するだけで、Claude Code のセッションは booth が
# 中の tmux に作る。このため command は sleep であり、working_dir も
# 持たない (booth が起動時にセッションごとに指定する)。
#
# remote-control は claude.ai への外向き通信のみで成立するため、
# ポート公開は不要。

services:
  denv-cc-remote:
    # レジストリへは公開しない。各利用者の手元でビルドして使う。
    # バージョン番号を持つのはベースイメージ (Dockerfile の FROM) だけであり、
    # 「どの devenviron の上に構築されたか」で環境が一意に定まる。
    # local タグはローカルビルドであることを示すための固定値。
    image: denv-cc-remote:local
    build:
      context: .
      dockerfile: Dockerfile
      # ビルド中のRUNが使うネットワーク。既定は default (bridge)。
      #
      # Jetson では docker の bridge ネットワークで名前解決に失敗することがあり、
      # ビルド中のダウンロードが
      #   dns error: ... Temporary failure in name resolution
      # で止まる。ベースイメージ側のJetson向けビルドスクリプトが
      # --network host を付けているのも同じ理由である。
      #
      # 該当する環境では .env などで host を指定する。
      #   DENV_BUILD_NETWORK=host
      network: ${DENV_BUILD_NETWORK:-default}
    # コンテナ自身は何もしない。セッションは booth が tmux に作る。
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
    # モバイルや claude.ai に表示されるデバイス名になる。
    # 指定しないと Docker が既定でコンテナ ID を hostname にするため、
    # 16進の羅列が表示されて判別できない。
    # サービス側で上書きすればプロジェクト単位で見分けられる。
    hostname: ${DENV_HOSTNAME:-denv}
    volumes:
      # 開発対象のワークスペース。各自の環境に合わせて WORKSPACES_ROOT を指定する。
      # 全サービスがツリー全体を同じようにマウントする。
      # working_dir はそのコンテナのセッションが始まる位置を選ぶだけであり、
      # マウント範囲を絞るものではない。
      - ${WORKSPACES_ROOT:-/root/workspaces}:/workspaces
      # Claude Code の認証情報・設定・セッション履歴。
      # .claude.json には組織情報(oauthAccount)と機能フラグのキャッシュが入っており、
      # これが失われると remote-control が
      # "Unable to determine your organization" で起動できなくなる。
      # 単一ファイルは名前付きボリュームで扱えないため、
      # .gitconfig などと同じく bind mount とする。
      # 事前にホスト側へ実体を作っておくこと(README の準備手順を参照)。
      - ${WORKSPACES_ROOT:-/root/workspaces}/.devcontainer/denv/.claude:/root/.claude
      - ${WORKSPACES_ROOT:-/root/workspaces}/.devcontainer/denv/.claude.json:/root/.claude.json
      # /root/.local/share/claude は永続化しない。
      # 名前付きボリュームの初期化はボリュームを作った1回だけで、
      # 2回目以降はイメージ側の内容を無視して既存の中身が優先される。
      # claude の実体は versions/<バージョン> であり
      # /root/.local/bin/claude はそこへのシンボリックリンクなので、
      # イメージを作り直すとリンク先がボリューム内に存在しなくなり
      # "exec: claude: executable file not found in $PATH" で起動できなくなる。
      # 自動更新の取得結果は失われるが、イメージ側のバージョンから再度更新されるだけである。
      #
      # Serena の設定とプロジェクトのインデックス、および取得済みの language server。
      # 永続化しないとコンテナを作り直すたびに再取得・再インデックスになる。
      # こちらはバージョン名を含むパスを参照しないため上記の問題は起きないが、
      # イメージを作り直してもボリューム側が優先される点は同じである。
      - serena-data:/root/.serena
      # 開発で利用する認証情報と設定。devcontainer 側と同じものを共有する。
      # **devcontainer.json の mounts と同じ一覧に揃えること。**
      # どちらから作業しても同じ環境になることを担保している以上、
      # 参照する設定が環境によって変わるのは筋が通らない。
      - ${WORKSPACES_ROOT:-/root/workspaces}/.devcontainer/denv/.ssh:/root/.ssh
      - ${WORKSPACES_ROOT:-/root/workspaces}/.devcontainer/denv/.aws:/root/.aws
      - ${WORKSPACES_ROOT:-/root/workspaces}/.devcontainer/denv/.gitconfig:/root/.gitconfig
      - ${WORKSPACES_ROOT:-/root/workspaces}/.devcontainer/denv/.git-credentials:/root/.git-credentials
      - ${WORKSPACES_ROOT:-/root/workspaces}/.devcontainer/denv/.npmrc:/root/.npmrc
      # uv / poetry / git などの設定が入る。イメージ側に /root/.config は無いため、
      # このマウントで隠れるものはない。
      - ${WORKSPACES_ROOT:-/root/workspaces}/.devcontainer/denv/.config:/root/.config
      # コンテナ内から docker コマンドを使うためのホストのソケット。
      # 導入しているのは docker CLI だけで、デーモンはホスト側のものを操作する。
      # ここから起動したコンテナはホスト上の兄弟コンテナになる。
      # 詳細と注意点は docs/docker.md を参照。
      - /var/run/docker.sock:/var/run/docker.sock
    # ここから起動したコンテナはホスト側のネットワークに属するため、
    # devcontainer 側と同様に host.docker.internal を引けるようにしておく。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # remote-control は機能フラグの評価結果に依存するため、
      # 以下を設定すると利用できなくなる。設定しないこと。
      #   DISABLE_TELEMETRY / DO_NOT_TRACK
      #   CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC / DISABLE_GROWTHBOOK
      # また ANTHROPIC_BASE_URL を api.anthropic.com 以外へ向けると利用できない。
      - TZ=${TZ:-Asia/Tokyo}
      # コンテナ内から docker run する際の -v はホスト側のパスとして解釈される。
      # /workspaces に対応するホスト側のパスを渡しておく。
      - DENV_HOST_WORKSPACES=${WORKSPACES_ROOT:-/root/workspaces}
