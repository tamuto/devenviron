# booth の設定サンプル。`booth init` はこのファイルを書き出す。
#
# booth 名 = workspaces_root 直下のフォルダ名 = tmux のセッション名。
# 例) booth open myproject  ->  /workspaces/myproject で myproject というセッションを起こす

[defaults]
# --target を省略したときに使うターゲット。targets が1つだけなら省略可。
target = "denv"
# booth 名はこの下のフォルダ名として解釈される。
workspaces_root = "/workspaces"
# tmux 内で起動するコマンド。{name} と {workdir} が展開される。
# --remote-control は「Remote Control を有効にした対話セッション」を起こす。
# サーバモード (claude remote-control サブコマンド) ではない点に注意。
command = "claude --remote-control {name}"

# 1つのコンテナに全 booth を同居させる構成 (denv-cc-remote の既定)。
# service は compose のサービス名。
[targets.denv]
compose_file = "/workspaces/.devcontainer/denv-cc-remote/docker-compose.yaml"
service = "denv"
# project = "denv-cc-remote"   # docker compose -p を明示したいとき

# プロジェクトごとにコンテナを分けている構成なら、service に {name} を書く。
# booth 名と同じ名前のサービスへ exec する。
# [targets.perproject]
# compose_file = "/workspaces/.devcontainer/denv-cc-remote/docker-compose.yaml"
# service = "{name}"

# 個別に上書きしたい booth だけ書けばよい。書かなくても open できる。
# [booths.myproject]
# target = "denv"
# command = "claude --remote-control myproject --add-dir /workspaces/shared"
